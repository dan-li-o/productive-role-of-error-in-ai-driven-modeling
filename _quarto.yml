project:
  type: website
  output-dir: _site
  resources:
    - notebook.js
    - qr-code.svg

website:
  title: "Productive Error"
  description: "The Productive Role of Error in AI-Driven Modeling, an Alfred P. Sloan Foundation project."
  site-url: "https://productive-error.org/"
  repo-url: "https://github.com/dan-li-o/productive-role-of-error-in-ai-driven-modeling"
  favicon: favicon.svg
  search: false
  open-graph: true
  twitter-card: true
  # image: share.png   # a screenshot of a notebook cell, 1200×630
  navbar:
    pinned: true
    logo: favicon.svg
    logo-alt: "Productive Error home"
    left:
      - href: about.qmd
        text: About
      - href: news.qmd
        text: News
      - href: people.qmd
        text: People
      - href: workshop.qmd
        # Drop the year once the workshop has happened.
        text: 'Workshop <span class="nav-year">’27</span>'
      - href: deliverables.qmd
        text: Deliverables
      - href: contact.qmd
        text: Get involved
  page-footer:
    left: |
      <p><span class="footer-name">Productive Error</span> · The Productive Role of Error in AI-Driven Modeling</p>
      <p>Supported by the Alfred P. Sloan Foundation</p>
      <p>Queens College, CUNY · NSF National Center for Atmospheric Research</p>
    right: |
      <span class="email-obfuscate" data-user="contact" data-domain="productive-error.org">contact [at] productive-error.org</span>
      · <span class="email-obfuscate" data-user="tech" data-domain="productive-error.org" data-subject="Website problem on productive-error.org" data-body="Page: {page}|What happened:|Device and browser, if you know:" data-label="Report a website problem">tech [at] productive-error.org</span>

      [Accessibility](/accessibility.qmd) · Text [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)<span class="footer-qr-text"> · [QR code](/qr-code.svg)</span>

      <a class="footer-qr" href="/qr-code.svg"><img src="/qr-code.svg" alt="QR code for productive-error.org" width="64" height="64"></a>

# Adds the render date for the header's "Last checkpoint".
filters:
  - checkpoint.lua

format:
  html:
    theme:
      - default
      - notebook.scss
    # GoatCounter visit counts: no cookies, no personal data.
    include-in-header:
      text: |
        <script data-goatcounter="https://dan-li-o.goatcounter.com/count"
                async src="//gc.zgo.at/count.js"></script>
    include-after-body: notebook-loader.html
    toc: true
    # Quarto extras the site doesn't use; each one adds a script.
    code-copy: false
    anchor-sections: false
    footnotes-hover: false
    crossrefs-hover: false
    citations-hover: false
    link-external-newwindow: true
