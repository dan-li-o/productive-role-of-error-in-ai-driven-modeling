project:
  type: website
  output-dir: _site
  resources:
    - notebook.js

website:
  title: "Productive Error"
  description: "The Productive Role of Error in AI-Driven Modeling, an Alfred P. Sloan Foundation project."
  site-url: "https://productive-error.org/"
  repo-url: "https://github.com/dan-li-o/productive-role-of-error-in-ai-driven-modeling"
  favicon: favicon.svg
  search: false
  open-graph: true
  twitter-card: true
  # image: share.png   # a screenshot of a notebook cell, 1200×630
  navbar:
    pinned: true
    logo: favicon.svg
    logo-alt: "Productive Error home"
    left:
      - href: about.qmd
        text: About
      - href: news.qmd
        text: News
      - href: people.qmd
        text: People
      - href: workshop.qmd
        text: Workshop
      - href: deliverables.qmd
        text: Deliverables
      - href: contact.qmd
        text: Get involved
  page-footer:
    left: |
      <p><span class="footer-name">Productive Error</span> · The Productive Role of Error in AI-Driven Modeling</p>
      <p>Supported by the Alfred P. Sloan Foundation</p>
      <p>Queens College, CUNY · NSF National Center for Atmospheric Research</p>
    right: |
      <span class="email-obfuscate" data-user="ryan.oloughlin" data-domain="qc.cuny.edu">ryan.oloughlin [at] qc.cuny.edu</span>
      · [Accessibility](/accessibility.qmd) · Text [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)

# Adds the render date for the header's "Last checkpoint".
filters:
  - checkpoint.lua

format:
  html:
    theme:
      - default
      - notebook.scss
    include-after-body: notebook-loader.html
    toc: true
    # Quarto extras the site doesn't use; each one adds a script.
    code-copy: false
    anchor-sections: false
    footnotes-hover: false
    crossrefs-hover: false
    citations-hover: false
    link-external-newwindow: true
